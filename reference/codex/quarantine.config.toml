approval_policy = "never"
default_permissions = "quarantine"
web_search = "disabled"
allow_login_shell = false

[shell_environment_policy]
inherit = "none"
ignore_default_excludes = false
set = { PATH = "/usr/bin:/bin:/usr/sbin:/sbin" }

[features]
apps = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
in_app_browser = false
plugins = false
remote_plugin = false
skill_mcp_dependency_install = false

[permissions.quarantine]
description = "Read only the exact workspace; deny secrets, user integrations, and network."

[permissions.quarantine.filesystem]
":minimal" = "read"

[permissions.quarantine.filesystem.":workspace_roots"]
"." = "read"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*credentials*" = "deny"
"**/*secret*" = "deny"

[permissions.quarantine.network]
enabled = false
